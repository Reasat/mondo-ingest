name: ICD10WHO integration check

on:
  pull_request:
    paths:
      - '.github/workflows/icd10who-integration.yml'
      - 'docs/icd10who-artifacts.md'
      - 'docs/icd10who-high-level-flow.*'
      - 'src/ontology/mondo-ingest.Makefile'
      - 'src/ontology/metadata/icd10who.yml'
      - 'src/ontology/config/icd10who_exclusions.tsv'
  push:
    branches:
      - icd10who-external-release
    paths:
      - '.github/workflows/icd10who-integration.yml'
      - 'docs/icd10who-artifacts.md'
      - 'docs/icd10who-high-level-flow.*'
      - 'src/ontology/mondo-ingest.Makefile'
      - 'src/ontology/metadata/icd10who.yml'
      - 'src/ontology/config/icd10who_exclusions.tsv'
  workflow_dispatch:

jobs:
  icd10who:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: obolibrary/odkfull:v1.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ICD10WHO integration targets
        working-directory: src/ontology
        run: make slurp/icd10who.tsv

      - name: Write job summary
        working-directory: src/ontology
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          mapping = Path("reports/icd10who_mapping_status.tsv")
          unmapped = Path("reports/icd10who_unmapped_terms.tsv")
          exclusions = Path("reports/icd10who_term_exclusions.txt")
          slurp = Path("slurp/icd10who.tsv")

          with mapping.open() as f:
              rows = list(csv.DictReader(f, delimiter="\t"))
          mapped = sum(1 for r in rows if r.get("is_mapped") == "True")
          excluded = sum(1 for r in rows if r.get("is_excluded") == "True")

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = [
              "### ICD10WHO integration summary",
              "",
              "| metric | value |",
              "|--------|-------|",
              f"| terms in mapping status | {len(rows)} |",
              f"| mapped | {mapped} |",
              f"| excluded (status flag) | {excluded} |",
              f"| unmapped rows | {sum(1 for _ in unmapped.open()) - 1} |",
              f"| exclusion list | {sum(1 for _ in exclusions.open())} |",
              f"| slurp proposals | {sum(1 for _ in slurp.open()) - 2} |",
              "",
              "Download the artifact zip for full TSV outputs.",
          ]
          summary.write_text("\n".join(lines) + "\n")
          PY

      - name: Upload integration outputs
        uses: actions/upload-artifact@v4
        with:
          name: icd10who-integration-${{ github.sha }}
          retention-days: 30
          path: |
            src/ontology/reports/icd10who_mapping_status.tsv
            src/ontology/reports/icd10who_unmapped_terms.tsv
            src/ontology/reports/icd10who_term_exclusions.txt
            src/ontology/reports/icd10who_exclusion_reasons.robot.template.tsv
            src/ontology/reports/component_signature-icd10who.tsv
            src/ontology/reports/mirror_signature-icd10who.tsv
            src/ontology/slurp/icd10who.tsv
